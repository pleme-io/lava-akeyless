[package]
authors = ["pleme-io"]
description = "lava-akeyless — autogenerated typed (deflava-resource …) shapes for the akeyless terraform provider. Mirrors pangea-akeyless. Source schema kept under schema.json; resources/*.tlisp + _index.tlisp regenerated via `lava-forge generate --schema schema.json --out resources`."
edition = "2024"
license = "MIT"
name = "lava-akeyless"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-akeyless"
version = "0.1.2"

[lib]
name = "lava_akeyless"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"
